# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Portal
options:
  bundleIdPrefix: com.example.portal   # ← change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""               # ← your 10-char Team ID (or pick the team in Xcode)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PortalPhone:
    type: application
    platform: iOS
    sources:
      - PortalPhone
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.portal.phone
        PRODUCT_NAME: Portal
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PortalPhone/Info.plist
      properties:
        CFBundleDisplayName: Portal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Portal shows your photos so you can drag them to your Mac.
        NSPhotoLibraryAddUsageDescription: Portal saves photos your Mac sends to your library.
        NSLocalNetworkUsageDescription: Portal finds your Mac on the local network to send and receive files.
        NSBonjourServices: [_portal._tcp]
        UIFileSharingEnabled: true           # received non-image files appear in the Files app
        LSSupportsOpeningDocumentsInPlace: true

  PortalMac:
    type: application
    platform: macOS
    sources:
      - PortalMac
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.portal.mac
        PRODUCT_NAME: Portal
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: PortalMac/Info.plist
      properties:
        CFBundleDisplayName: Portal
        LSUIElement: true                    # menu-bar only, no Dock icon
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Portal receives files from your iPhone over the local network.
        NSBonjourServices: [_portal._tcp]
        NSAppleEventsUsageDescription: Portal reads the current song from Music or Spotify to show it full screen with lyrics.
    entitlements:
      path: PortalMac/PortalMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true            # NWListener
        com.apple.security.network.client: true
        com.apple.security.files.downloads.read-write: true # save to ~/Downloads
        com.apple.security.files.user-selected.read-only: true # "Send File…" open panel
        com.apple.security.automation.apple-events: true         # Now Playing (hardened runtime)
        com.apple.security.temporary-exception.apple-events:      # Now Playing (sandbox): only these two apps
          - com.apple.Music
          - com.spotify.client
